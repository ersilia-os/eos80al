Identifier: eos80al
Slug: hit-locator-similarity
Status: In progress
Title: Enamine Hit Locator Similarity
Description: Retrieves the 100 nearest neighbours of a query molecule in the 
  Enamine Hit Locator Library, a set of 460, 160 screening compounds indexed by 
  Ersilia. Three learned embeddings are searched independently, namely CLAMP for
  bioactivity, SAND for 3D shape and Mol-JEPA for predicted biological context, 
  and their rankings are fused into one list. Ersilia built the search with 
  LazySim, which indexes each embedding with turbovec 4-bit quantization.
